name: Deploy GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Quality gate
        run: |
          python scripts/build_catalog.py
          python scripts/build_product_pages.py
          python scripts/validate_site.py
          node --check assets/js/catalog-data.js
          node --check assets/js/app.js
          node --check assets/js/vfx.js
          node --check sw.js
          python -m unittest discover -s tests -v
      - name: Build static site for this repository
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/build_static.py
      - name: Validate built output
        run: |
          test -f dist/index.html
          test -f dist/offline.html
          test -f dist/sitemap.xml
          test -f dist/produtos/coca-cola-1-5l/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
